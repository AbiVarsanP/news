{% extends "base.html" %}

{% block title %}Password Changed Successfully{% endblock title %}

{% block content %}
<div class="auth-container">
    <div class="card-modern auth-card fade-in-up">
        <div class="auth-header success-message">
            <i class="fas fa-check-circle icon-xl" style="color: var(--success-color);"></i>
            <h2>Password Changed Successfully!</h2>
            <p class="text-secondary">Your password has been updated. Your account is now secured with your new password.</p>
        </div>
        
        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <a href="{% url 'home' %}" class="btn-modern btn-primary btn-lg">
                <i class="fas fa-home"></i> Go to Home
            </a>
        </div>
        
        <div class="auth-footer">
            <p><a href="{% url 'article_list' %}"><i class="fas fa-book-open"></i> View Articles</a></p>
        </div>
    </div>
</div>
{% endblock content %}
