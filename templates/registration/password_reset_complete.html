{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock title %}

{% block content %}
<div class="auth-container">
    <div class="card-modern auth-card fade-in-up">
        <div class="auth-header success-message">
            <i class="fas fa-circle-check icon-xl" style="color: var(--success-color);"></i>
            <h2>Password Reset Complete!</h2>
            <p class="text-secondary">Your password has been successfully reset. You can now log in with your new password.</p>
        </div>
        
        <div style="text-align: center; margin-top: var(--spacing-xl);">
            <a href="{% url 'login' %}" class="btn-modern btn-primary btn-lg">
                <i class="fas fa-sign-in-alt"></i> Go to Login
            </a>
        </div>
        
        <div class="auth-footer">
            <p><a href="{% url 'home' %}"><i class="fas fa-home"></i> Back to Home</a></p>
        </div>
    </div>
</div>
{% endblock content %}
